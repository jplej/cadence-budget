# Render Blueprint for Cadence: one web service + one Postgres database.
# Secrets marked `sync: false` are asked for in the dashboard when the Blueprint is created; they never live in git.
databases:
  - name: cadence-db
    databaseName: cadence
    user: cadence
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"

services:
  - type: web
    name: cadence
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: ohio
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cadence-db
          property: connectionString
      - key: SOURCE
        value: drive
      - key: DRIVE_FOLDER_ID
        value: 1LPLYPYfalEZXolmCzhrGV0qrswP0TICM
      - key: SYNC_INTERVAL_HOURS
        value: "12"
      - key: TZ
        value: America/Toronto
      - key: SESSION_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
